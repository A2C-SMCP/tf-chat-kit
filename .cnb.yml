.tf-chat-kit-ci: &tf-chat-kit-ci
  name: tf-chat-kit quality gate
  runner:
    cpus: 4
  docker:
    image: node:24-bookworm-slim
  stages:
    - name: install
      timeout: 10m
      script:
        - corepack enable
        - corepack prepare pnpm@10.34.5 --activate
        - pnpm install --frozen-lockfile
    - name: architecture-and-quality
      timeout: 10m
      script:
        - pnpm check:workspace
        - pnpm check:changesets
        - pnpm check:boundaries
        - pnpm lint
        - pnpm format:check
        - pnpm typecheck
        - pnpm test
    - name: package-installation
      timeout: 10m
      script:
        - pnpm pack:check

main:
  push:
    - <<: *tf-chat-kit-ci

"**":
  pull_request:
    - <<: *tf-chat-kit-ci
